<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Побег от дизайнера | Wolf Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="game-header">
            <div class="header-block">
                <span>Статус:</span>
                <span id="status-display" class="highlight">Рендеринг...</span>
            </div>
            <div class="header-block">
                <span>Время выжить:</span>
                <span id="timer-display" class="timer">60s</span>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            
            <!-- Окно зависания ПК (Головоломка) -->
            <div class="freeze-overlay" id="puzzle-box">
                <div class="puzzle-title">💻 ПК ЗАВИС! Реши пример:</div>
                <div class="puzzle-question" id="puzzle-question">3 + 5 = ?</div>
                <div class="puzzle-answers" id="puzzle-answers">
                    <!-- Сюда JS вставит кнопки с ответами -->
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно конца игры / победы -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2 id="modal-title">Результат</h2>
            <p id="modal-desc">Описание</p>
            <button class="modal-btn" id="modal-btn">Перезапуск</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
