<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Бюджет против Правок | Wolf Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="game-header">
            <div class="header-block">
                <span>Уровень:</span>
                <span id="level-display" class="highlight">1</span>
            </div>
            <div class="header-block">
                <span>Бюджет:</span>
                <span id="budget-display" class="money">0 ₽</span>
            </div>
            <div class="header-block">
                <span>Цель:</span>
                <span id="target-display">100 000 ₽</span>
            </div>
        </div>

        <!-- Игровое поле -->
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Модальное окно: Конец игры / Переход уровня -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2 id="modal-title">Поздравляем!</h2>
            <p id="modal-desc">Вы набрали необходимую сумму.</p>
            <div class="modal-score" id="modal-score">0 ₽</div>
            <button class="modal-btn" id="modal-btn">Далее</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
