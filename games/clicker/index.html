<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Бюджет на Ремонт | Wolf Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Стартовый экран с инструкцией -->
        <div class="modal-overlay" id="start-modal" style="display: flex;">
            <div class="modal-content">
                <h2>🏡 Правила игры</h2>
                <p style="margin: 15px 0 25px; line-height: 1.5; color: #e5e5ea;">
                    Перемещайте кошелёк, чтобы собрать деньги на ремонт. Избегайте дорогостоящих покупок, которые преследуют Вас!
                </p>
                <button class="modal-btn" id="start-btn">Начать ремонт</button>
            </div>
        </div>

        <div class="game-header">
            <div class="header-block">
                <span>Уровень:</span>
                <span id="level-display" class="highlight">1</span>
            </div>
            <div class="header-block">
                <span>Бюджет:</span>
                <span id="budget-display" class="money">0 ₽</span>
            </div>
            <div class="header-block">
                <span>Цель:</span>
                <span id="target-display">50 000 ₽</span>
            </div>
        </div>

        <!-- Игровое поле -->
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Модальное окно конца игры / перехода уровня -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2 id="modal-title">Поздравляем!</h2>
            <p id="modal-desc">Вы набрали необходимую сумму.</p>
            <div class="modal-score" id="modal-score">0 ₽</div>
            <button class="modal-btn" id="modal-btn">Далее</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
