<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кирилл Бахарев | 3D-визуализация</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем шрифты (например, чистый Inter) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            
            <!-- Левая часть: Лого и Имя -->
            <div class="header-logo-block">
                <img src="img/logo.png" alt="Логотип" class="logo-img">
                <span class="brand-name">Кирилл Бахарев</span>
            </div>

            <!-- Бургер-меню для мобилок -->
            <button class="menu-toggle" aria-label="Открыть меню">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Центр: Навигация -->
            <nav class="header-nav">
                <a href="#about" class="nav-link">Обо мне</a>
                <a href="#tour" class="nav-link">3D-тур</a>
                <a href="#gallery" class="nav-link">Галерея</a>
            </nav>

            <!-- Правая часть: Контакты и Соцсети -->
            <div class="header-actions">
                <a href="#contacts" class="btn-contacts">Контакты</a>
                <div class="social-icons">
                    <!-- Замени '#' на свои реальные ссылки -->
                    <a href="#" target="_blank" class="social-link tg-icon" title="Telegram">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
                    </a>
                    <a href="#" target="_blank" class="social-link max-icon" title="Max">
                        <!-- Временная буква M, потом заменим на иконку (3ds Max / другое) -->
                        <span class="letter-icon">M</span>
                    </a>
                </div>
            </div>

        </div>
    </header>

    <!-- Временные пустые блоки, чтобы проверить плавный скролл -->
    <main style="background: #1a1a1a; color: #fff; padding-top: 120px;">
        <section id="about" style="height: 80vh; padding: 40px;"><h2>Блок: Обо мне</h2></section>
        <section id="tour" style="height: 80vh; padding: 40px; background: #222;"><h2>Блок: 3D-тур</h2></section>
        <section id="gallery" style="height: 80vh; padding: 40px;"><h2>Блок: Галерея</h2></section>
        <footer id="contacts" style="height: 50vh; padding: 40px; background: #111;">
            <h2>Контакты</h2>
            <p>Email: wolf-studio@bk.ru</p>
            <p>Телефон: +7 (905) 906-04-19</p>
        </footer>
    </main>

    <!-- Скрипт для мобильного меню -->
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const headerNav = document.querySelector('.header-nav');
        const headerActions = document.querySelector('.header-actions');

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            headerNav.classList.toggle('active');
            headerActions.classList.toggle('active');
        });

        // Закрываем меню при клике на ссылку (для мобилок)
        document.querySelectorAll('.header-nav a, .btn-contacts').forEach(link => {
            link.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                headerNav.classList.remove('active');
                headerActions.classList.remove('active');
            });
        });
    </script>
</body>
</html>
