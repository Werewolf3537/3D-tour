    <!-- СКРИПТ ДЛЯ МОБИЛЬНОГО МЕНЮ (БУРГЕРА) -->
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const headerNav = document.querySelector('.header-nav');
        const headerActions = document.querySelector('.header-actions');

        // Клик по бургеру открывает и закрывает меню
        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            headerNav.classList.toggle('active');
            headerActions.classList.toggle('active');
        });

        // Автоматически закрываем меню при клике на любую ссылку в нем (для мобилок)
        document.querySelectorAll('.header-nav a, .btn-contacts').forEach(link => {
            link.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                headerNav.classList.remove('active');
                headerActions.classList.remove('active');
            });
        });
    </script>
